<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ad Mute</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Ad Mute for Streaming</h1>

    <button id="manualToggle">Toggle mute on this tab</button>

    <section>
      <h2>Sites</h2>
      <label><input type="checkbox" data-site="youtube" /> YouTube</label>
      <label><input type="checkbox" data-site="hulu" /> Hulu</label>
      <label><input type="checkbox" data-site="disneyplus" /> Disney+</label>
      <label><input type="checkbox" data-site="peacock" /> Peacock</label>
      <label><input type="checkbox" data-site="hbomax" /> Max / HBO Max</label>
    </section>

    <section>
      <label
        ><input type="checkbox" id="debugToggle" /> Debug logging (console +
        log below)</label
      >
    </section>

    <section>
      <h2>Recent activity</h2>
      <div id="log"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
